<br>
<br>
<div class="page-center">
  <div class="form-card">
<br>
<div>{{message}}</div>
<br>

<mat-form-field appearance="fill" class="yellow-field full-width">
  <mat-label>Seadme foto (URL)</mat-label>
  <input matInput [(ngModel)]="image" name="image" placeholder="Kleebi pildi URL siia">
</mat-form-field>

<mat-form-field appearance="fill" class="yellow-field full-width">
  <mat-label>Seadme nimi</mat-label>
  <input matInput [(ngModel)]="title" name="title">
</mat-form-field>

<mat-form-field appearance="fill" class="yellow-field full-width">
  <mat-label>Seadme kategooria</mat-label>
  <mat-select [(ngModel)]="category" name="category">
    <mat-option value="">Vali kategooria</mat-option>
    @for (c of categories; track $index) {
      <mat-option [value]="c.name">{{ c.name }}</mat-option>
    }
  </mat-select>
</mat-form-field>

<mat-form-field appearance="fill" class="yellow-field full-width">
  <mat-label>Päeva hind</mat-label>
  <input matInput [(ngModel)]="price" name="price" type="number">
</mat-form-field>

<mat-form-field appearance="fill" class="yellow-field full-width">
  <mat-label>Seadme info</mat-label>
  <textarea matInput [(ngModel)]="description" name="description" rows="4"></textarea>
</mat-form-field>

<mat-checkbox [(ngModel)]="active" name="active" class="yellow-checkbox">
  Aktiivne
</mat-checkbox>

<button mat-flat-button class="btn-soft" (click)="add()">Lisa</button>
  </div>
</div>
