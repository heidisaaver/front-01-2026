

<br>

 <input [(ngModel)]="searchTerm" (ngModelChange)="search()"  type="text" >

    <label (click)="search()">Search from product title</label><br>

<br>


<table>
    <thead>
        <tr>
        <th>ID</th>
        <th>Category</th>
        <th>Product title</th>
        <th>Price</th>
        <th>Product description</th>
        <th>Image</th>
        <th>Delete</th>
        <th>Change</th>
        </tr>
    </thead>
    <tbody>
        @for (product of products; track $index) {
            <tr>
                <td>{{product.id}}</td>
                <td>{{product.category}}</td>
                <td>{{product.title}}</td>
                <td>{{product.price}}</td>
                <td>{{product.description}}</td>
                <td>{{product.image}}</td>

                <td> <button (click)="deleteProduct($index, product.id)">x</button> </td>
                <td><button routerLink="/halda-seadmeid/{{product.id}}">Change</button></td>
            </tr>
        }

    </tbody>

</table>
