@if (product && categories.length > 0) { 
    <br>

    <input [(ngModel)]="product.id" disabled type="text" >
    <label>Seadme id</label><br>
   
    <input [(ngModel)]="product.title" type="text" >
    <label>Seadme nimi</label><br>

    <input [(ngModel)]="product.price" type="number" >
    <label>Seadme hind</label><br>

    <input [(ngModel)]="product.description" type="text" >
    <label>Seadme kirjeldus</label><br>

    <select [(ngModel)]="product.category">
        <option disable value="">Vali kategooria</option>
        @for(c of categories; track $index) {
            <option>{{c.name}}</option>
        }
    </select> 
    <label>Seadme kategooria </label><br>

    <input [(ngModel)]="product.image" type="text" >
    <label>Seadme pilt </label><br>

    <input [(ngModel)]="product.rating" disabled type="number" >
    <label>Seadme hinnang </label><br>

    <input [(ngModel)]="product.count" disabled type="number" >
    <label>Seadme hinnangu arv </label><br>

    <input [(ngModel)]="product.active" type="checkbox" >
    <label>Seadme aktiivne </label><br>
   

    <br>
    <button (click)="change()">Muuda</button>
   
}   @else {
    <div>Seadet ei leitud</div>
}
