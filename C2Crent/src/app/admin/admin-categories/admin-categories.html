@if (loading === true) {
    <div>Oota, laen...</div>
} @else {
<br>
<label>Nimi</label><br>
<input [(ngModel)]="name" type="text"><br>
<label>Pilt </label><br>
<input [(ngModel)]="image" type="text" placeholder="Kleebi pildi URL siia">
<br>

<button mat-flat-button class="btn-soft" (click)="addCategory()">Lisa</button>


<table>
    <thead>
        <tr>
        <th>#</th>
        <th>ID</th>
        <th>Pilt</th>
        <th>Nimi</th>
        <th>Loomise kuupäev</th>
        <th>Kustuta</th>
        </tr>
    </thead>
    <tbody>

        @for(category of categories; track $index) {
        <tr>
            <td>{{$index + 1}}</td>
            <td>{{category.id}}</td>
            <td> <img class="image" src="{{category.avatar}}" alt=""></td>
            <td>{{category.name}}</td>
            <td>{{category.createdAt}}</td>
            <td><button mat-flat-button class="btn-soft" (click)="deleteCategory(category.id, $index)">x</button></td>
            </tr> 
         }
</tbody>
</table>
}
