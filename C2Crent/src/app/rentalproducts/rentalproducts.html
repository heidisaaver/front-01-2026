<br>
<br>
<br>


<div class="categories">
  <button class="category-btn" clicked (click)="filterCategoryAed()">
    <img class="picture" src="assets/aed.jpg" alt="Aed"/>
    <span>Aed</span>
  </button>

  <button class="category-btn" (click)="filterCategoryEhitus()">
    <img class="picture" src="assets/ehitus.jpg" alt="Ehitus"/>
    <span>Ehitus</span>
  </button>

  <button class="category-btn" (click)="filterCategoryElekter()">
    <img class="picture" src="assets/elektritööriistad.jpg" alt="Elekter"/>
    <span>Elektritööriistad</span>
  </button>

  <button class="category-btn" (click)="filterCategoryKasitoo()">
    <img class="picture" src="assets/käsitööriistad.jpg" alt="Käsitöö"/>
    <span>Käsitööriistad</span>
  </button>

  <button class="category-btn" (click)="filterCategoryPuhastus()">
    <img class="picture" src="assets/puhastus.jpg" alt="Puhastus"/>
    <span>Puhastus</span>
  </button>
</div>

<div>Kokku seadmeid valitud kategoorias: {{products.length}} tk</div>
<br>

<br>
<br>

<button mat-flat-button class="btn-soft" (click)="sortAZ()"> Sorteeri AZ</button>
<button mat-flat-button class="btn-soft" (click)="sortZA()"> Sorteeri ZA</button>

<button mat-flat-button class="btn-soft" (click)=" sortRatingAsc()"> Sorteeri hind kasvavalt</button>

<button mat-flat-button class="btn-soft" (click)=" sortRatingDes()"> Sorteeri hind kahanevalt</button>

<br><br>

@for (category of categories; track $index) {
  
    <button mat-flat-button class="btn-soft" (click)="filterCategory(category.name)">{{category.name}}</button>

}


<br>


<br>

<div class="products">
@for (product of products; track $index) {
    
    <div class="product" > 
        <img class="image" src="{{product.image}}" alt="">
        <div>{{product.title}}  </div>
        <div>{{product.price}} €</div> 
        <button mat-flat-button class="btn-soft" (click)="addToCart(product)">Lisa rendikorvi</button>
        <button mat-flat-button class="btn-soft" routerLink="/product/{{product.id}}">Vaata detaile</button>
    </div>
}
</div>

<br>
<div>Hind kokku: {{calculateTotal()}} €</div>
