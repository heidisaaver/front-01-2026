    <mat-form-field class="example-full-width">
    <mat-label>Title</mat-label>
    <input [(ngModel)]="title" matInput placeholder="iPhone" value="">

    <input [(ngModel)]="price" type="number" >
    <label>Product price </label><br>

    <input [(ngModel)]="description" type="text" >
    <label>Product description </label><br>
   
    <select [(ngModel)]="category">
        <option disable value="">Choose category</option>
        @for(c of categories; track $index) {
            <option>{{c.name}}</option>
        }
    </select>
    <label>Product category</label><br>


    <mat-slide-toggle [(ngModel)]="active">Product active</mat-slide-toggle>
