
@if (ostukorv.length === 0) {
<div>Ostukorv on tühi</div>
} 

@else {

<button (click)="tyhjenda()">Tühjenda</button>

<div>Toodete koguarv {{ostukorv.length}} tk</div>

<div>Ostukorvi kogusumma: {{arvutaKokku()}} €</div>
}

<br>
@for(toode of ostukorv; track toode) {
   <div>{{toode.nimi}} - {{toode.hind}} € <button (click)="kustuta($index)">x</button></div>
   
}
