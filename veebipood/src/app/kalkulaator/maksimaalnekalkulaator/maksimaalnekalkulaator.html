
<br>
<label >Laenu soovin võtta</label>
<br>

<input id="yksi" name="taotleja" type="radio" [(ngModel)]="taotleja" value="1" (ngModelChange)="arvutaMaksimaalnelimiit()" >
<label for="yksi">Üksi</label>
<br>
<input id="koos" name="taotleja" type="radio" [(ngModel)]="taotleja" value="2" (ngModelChange)="arvutaMaksimaalnelimiit()" >
<label for="koos">Koos kaastaotlejaga</label>




<br>
<label>Perekonnaseis</label>
<input [(ngModel)]="perekonnaseis" id="perekonnaseis" type="checkbox" (ngModelChange)="arvutaMaksimaalnelimiit()" > 
<label for="perekonnaseis" > <label>abielus või vabaabielus</label>
<br>
<label >Ülalpeetavate arv</label>
<select [(ngModel)]="ylalpeetavad" (ngModelChange)="arvutaMaksimaalnelimiit()" >
    <option>0</option>
    <option>1</option>
    <option>2</option>
    <option>3</option>
    <option>4</option>
    <option>5</option>
    <option value="6">6 või rohkem</option>
</select> <br>
<label>Netosissetulek</label>
<input [(ngModel)]="netosissetulek" (ngModelChange)="arvutaMaksimaalnelimiit()" type="number"> <br>
<label>Igakuised kohustused</label>
<input [(ngModel)]="kohustused" (ngModelChange)="arvutaMaksimaalnelimiit()" type="number"> <br>
<br>
<div>Maksimaalne pakutav limiit {{maksimaalnelimiit.toFixed(2)}} €</div>
<br>
<button class="nupp">Taotle kodulaenu</button>
