


<table>
    <thead>
        <tr>
        <th>Toote id</th>
        <th>Toote nimi</th>
        <th>Toote hind</th>
         <th>Toote kirjeldus</th>
        <th>Toote kategooria</th> 
         <th>Toote pilt</th>
        <th>Toote reiting</th>
        </tr>
    </thead>
    <tbody>
        @for (product of dataResource.value(); track $index) {
            <tr>
                <td>{{product.id}}</td>
                <td>{{product.title}}</td>
                <td>{{product.price}}</td>
                <td>{{product.description}}</td>
                <td>{{product.category}}</td>
                <td><img class="pilt" src={{product.image}} alt=""></td>
                <td>{{product.rating.rate}} / {{product.rating.count}}</td>
                
            </tr>
        }

    </tbody>

</table>
