<button (click)="sorteeriAZ()"> Sorteeri AZ</button>

@for (auto of autod; track $index) {
    <div>{{auto.nimi}}  ({{auto.hind}} €)
    <button [disabled]="auto.aktiivne === false" (click)="lisaOstukorvi(auto)">Lisa ostukorvi</button>
    <button routerLink="/auto/{{auto.nimi}}">Vt detailsemalt</button>
</div>
}

<br>
<div>Kõik hinnad kokku: {{arvutaKokku()}} €</div>
