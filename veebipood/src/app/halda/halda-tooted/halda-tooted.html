

<table>
    <thead>
        <tr>
        <th>Järjekorranumber</th>
        <th>Index</th>
        <th>Toote nimi</th>
        <th>Toote hind</th>
        <th>Toote pilt</th>
        <th>Toote aktiivne</th>
        <th>Kustuta</th>
        </tr>
    </thead>
    <tbody>
        @for (toode of tooted; track $index) {
            <tr>
                <td>{{$index + 1}}</td>
                <td>{{$index}}</td>
                <td>{{toode.nimi}}</td>
                <td>{{toode.hind}}</td>
                <td>{{toode.pilt}}</td>
                <td>{{toode.aktiivne}}</td>
                <td> <button (click)="kustuta($index)">x</button> </td>
                <td><button routerLink="/muuda-toode/{{$index}}">Muuda</button></td>
            </tr>
        }

    </tbody>

</table>
